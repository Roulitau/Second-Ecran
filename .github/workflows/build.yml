name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compiler l'exe (C#, sans Python)
        run: dotnet publish windows/SecondEcran.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Ajouter ffmpeg et adb
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force SecondEcran | Out-Null
          Copy-Item publish/SecondEcran.exe SecondEcran/
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName SecondEcran/
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          foreach ($f in "adb.exe","AdbWinApi.dll","AdbWinUsbApi.dll") { Copy-Item "pt/platform-tools/$f" SecondEcran/ }
          Get-ChildItem SecondEcran
      - uses: actions/upload-artifact@v4
        with:
          name: SecondEcran-Windows
          path: SecondEcran

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accepter les licences Android (SDK déjà installé sur le runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SecondEcran-Android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
